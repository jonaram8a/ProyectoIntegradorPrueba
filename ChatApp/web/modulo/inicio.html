<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChatApp - Panel Vendedor</title>
    <link rel="stylesheet" href="../style/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="../style/sweetalert2/sweetalert2.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-success shadow mb-4">
        <div class="container">
            <span class="navbar-brand">
                <img src="../img/Aplicacion.png" width="30" class="me-2" alt="Logo"> ChatApp Vendedor
            </span>
            <button class="btn btn-outline-light btn-sm" onclick="location.href='../index.html'">Salir</button>
        </div>
    </nav>

    <main class="container">
        <div class="row g-4">
            
            <div class="col-md-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white fw-bold text-success fs-5">Cotizador de Materiales</div>
                    <div class="card-body">
                        
                        <label class="form-label fw-bold">Selecciona el Material:</label>
                        <select id="txtMaterial" class="form-select mb-3">
                            <option value="Cobre de Primera">Cobre de Primera ($135.00)</option>
                            <option value="Cobre de Segunda">Cobre de Segunda ($120.00)</option>
                            <option value="PET Transparente">PET Transparente ($6.50)</option>
                            <option value="Aluminio Latas">Aluminio Latas ($18.50)</option>
                        </select>
                        
                        <label class="form-label fw-bold">Peso Aproximado (kg):</label>
                        <input id="txtPeso" type="number" class="form-control mb-4" placeholder="Ej: 10.5">
                        
                        <button class="btn btn-success btn-lg w-100 fw-bold shadow-sm" onclick="enviarDatosReciclaje();">
                            Calcular Pago
                        </button>
                        
                        <div class="text-center mt-4 p-3 bg-light rounded border">
                            <h3 class="text-primary fw-bold mb-0" id="txtResultado">$ 0.00</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card border-primary shadow-sm h-100">
                    <div class="card-body text-center d-flex flex-column justify-content-center p-4">
                        <h4 class="card-title text-primary fw-bold mb-4">📍 Recolección GPS</h4>
                        
                        <div class="p-3 mb-4 bg-light border rounded shadow-sm">
                            <p id="mapStatus" class="fs-5 fw-bold text-secondary mb-0">Esperando coordenadas...</p>
                        </div>
                        
                        <button class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" onclick="obtenerUbicacion()">
                            Activar Ubicación
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script src="../style/sweetalert2/sweetalert2.min.js"></script>
    <script src="../js/reciclajeApp.js"></script>
</body>
</html>
